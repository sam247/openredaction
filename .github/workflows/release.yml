name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # Version commits are created by Changesets with skipCI disabled in
      # .changeset/config.json so merging the Version Packages PR can run CI
      # and trigger publish.yml (which keys off packages/*/package.json bumps).
      #
      # Pinned to changesets/action v1 (latest v1 release). v2 requires the
      # Changesets CLI v3 and renamed inputs (version -> version-script,
      # commit -> commit-message, title -> pr-title), while this repo is on
      # @changesets/cli ^2.31.1. Do not bump past v1 without upgrading the CLI.
      # No `publish` input here on purpose: this workflow only opens the
      # Version Packages PR, and publishing stays gated in publish.yml.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"
